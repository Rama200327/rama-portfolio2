# Builds the portfolio as a static, prerendered site and publishes it to GitHub Pages.
#
# Two ways to publish (pick one in the GitHub repo settings):
#  A) Same repo (repo must be public on the free plan):
#     Settings -> Pages -> Source: "GitHub Actions".
#  B) Private source repo + public site repo (free):
#     - Create a public repo named <username>.github.io (only the built site goes there).
#     - Settings -> Secrets and variables -> Actions:
#         Variable  PAGES_REPO          = <username>/<username>.github.io
#         Secret    PAGES_DEPLOY_TOKEN  = a fine-grained token with "Contents: Read and write" on that repo
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build static site
        run: |
          # The site lives at / for a <user>.github.io repo or a custom domain, otherwise at /<repo-name>/.
          # Set the repo variable PAGES_BASE to "/" when you connect a custom domain.
          TARGET="${{ vars.PAGES_REPO }}"
          REPO="${TARGET#*/}"
          [ -z "$TARGET" ] && REPO="${{ github.event.repository.name }}"
          BASE="${{ vars.PAGES_BASE }}"
          if [ -z "$BASE" ]; then
            case "$REPO" in *.github.io) BASE="/" ;; *) BASE="/$REPO/" ;; esac
          fi
          GITHUB_PAGES_BASE="$BASE" bun run build
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      # Option B: push only the built site to the public site repo.
      - name: Publish to the public site repo
        if: ${{ vars.PAGES_REPO != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ${{ vars.PAGES_REPO }}
          publish_branch: main
          publish_dir: dist/client
          force_orphan: true
          commit_message: Update site

      # Option A: publish from this repo.
      - if: ${{ vars.PAGES_REPO == '' }}
        uses: actions/configure-pages@v5
      - if: ${{ vars.PAGES_REPO == '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    if: ${{ vars.PAGES_REPO == '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
