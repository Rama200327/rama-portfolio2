# Builds the portfolio as a static, prerendered site and publishes it to GitHub Pages.
# One-time setup in the GitHub repo: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build static site
        run: |
          # Project sites live at /<repo-name>/; a <user>.github.io repo or a custom domain lives at /.
          # Set the repo variable PAGES_BASE to "/" when you connect a custom domain.
          REPO="${{ github.event.repository.name }}"
          BASE="${{ vars.PAGES_BASE }}"
          if [ -z "$BASE" ]; then
            case "$REPO" in *.github.io) BASE="/" ;; *) BASE="/$REPO/" ;; esac
          fi
          GITHUB_PAGES_BASE="$BASE" bun run build
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
